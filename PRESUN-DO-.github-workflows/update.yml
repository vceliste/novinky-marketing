name: Aktualizace radaru

on:
  schedule:
    # každé 2 hodiny mezi ~6:00 a 22:00 pražského času (UTC+2 v létě)
    - cron: "23 4-20/2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Spustit pipeline (sběr + AI zpracování)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m radar.pipeline

      - name: Uložit nová data do repozitáře
        run: |
          git config user.name "marketing-radar-bot"
          git config user.email "bot@vceliste.cz"
          git add -A data/
          git diff --cached --quiet || git commit -m "data: aktualizace $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push

      - name: Vygenerovat web (členská sekce /novinky)
        env:
          RADAR_BASE_URL: /novinky
          RADAR_SITE_URL: https://akademie.vceliste.cz/novinky
        run: python site/build.py

      - name: Nahrát web na hosting akademie (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: _site/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
